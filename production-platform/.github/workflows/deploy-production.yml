name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: amzan96/hajjmed-api

jobs:
  # =========================================================================
  # BUILD & PUSH DOCKER IMAGE
  # =========================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./production-platform
          file: ./production-platform/apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Set image output
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # =========================================================================
  # RUN TESTS
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          npm install -g pnpm
          cd production-platform
          pnpm install

      - name: Run linting
        run: cd production-platform && pnpm lint

      - name: Run tests
        run: cd production-platform && pnpm test

  # =========================================================================
  # DEPLOY TO PRODUCTION
  # =========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Navigate to deployment directory
          cd ${{ secrets.DEPLOY_PATH }} || mkdir -p ${{ secrets.DEPLOY_PATH }} && cd ${{ secrets.DEPLOY_PATH }}
          
          # Pull latest code
          git pull origin main
          
          # Copy environment file
          cp .env.production .env.production.bak || true
          
          # Navigate to production platform
          cd production-platform
          
          # Pull latest image
          docker pull ${{ needs.build.outputs.image }}
          
          # Stop old services
          docker compose -f docker-compose.production.yml down || true
          
          # Start new services
          docker compose -f docker-compose.production.yml up -d --build
          
          # Wait for services
          sleep 10
          
          # Verify health
          if curl -f http://localhost:4000/health/ready > /dev/null 2>&1; then
            echo "✅ API health check passed"
          else
            echo "❌ API health check failed"
            docker compose -f docker-compose.production.yml logs api
            exit 1
          fi
          
          echo "✅ Deployment successful"
          EOF

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          curl -f https://${{ secrets.DEPLOY_HOST }}/health/ready || echo "Warning: Could not verify via HTTPS (may still be ok)"

      - name: Notify Slack (Success)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ HajjMed Production Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *HajjMed Production Deployment*\n*Status:* Successful\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Message:* ${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View API"
                      },
                      "url": "https://${{ secrets.DEPLOY_HOST }}/docs"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ HajjMed Production Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *HajjMed Production Deployment*\n*Status:* Failed\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Check logs for details*"
                  }
                }
              ]
            }

  # =========================================================================
  # POST-DEPLOYMENT VALIDATION
  # =========================================================================
  validate:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          for i in {1..5}; do
            if curl -f https://${{ secrets.DEPLOY_HOST }}/health/ready; then
              echo "✅ API is responding"
              exit 0
            fi
            echo "Attempt $i/5... waiting"
            sleep 5
          done
          echo "❌ API health check failed"
          exit 1

      - name: Check monitoring
        run: |
          echo "Checking monitoring stack..."
          curl -f https://monitoring.${{ secrets.DEPLOY_HOST }} || echo "Note: Monitoring may not be accessible externally"

      - name: Generate deployment report
        if: always()
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Health**: ✅ Verified" >> $GITHUB_STEP_SUMMARY
