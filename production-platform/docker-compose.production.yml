version: '3.9'

services:
  # =========================================================================
  # API SERVER
  # =========================================================================
  api:
    image: amzan96/hajjmed-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hajjmed-api
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hajjmed-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =========================================================================
  # REDIS (Caching & Sessions)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: hajjmed-redis
    command: 
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hajjmed-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # =========================================================================
  # POSTGRESQL (Local backup - Optional if using managed Supabase)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hajjmed-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hajjmed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hajjmed-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # =========================================================================
  # MONITORING: Prometheus (Metrics Collection)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hajjmed-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - hajjmed-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # =========================================================================
  # MONITORING: Grafana (Visualization)
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: hajjmed-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.yourdomain.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - hajjmed-net
    restart: always
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # =========================================================================
  # LOGGING: Loki (Log Aggregation)
  # =========================================================================
  loki:
    image: grafana/loki:latest
    container_name: hajjmed-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - hajjmed-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # =========================================================================
  # LOGGING: Promtail (Log Forwarder)
  # =========================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: hajjmed-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - hajjmed-net
    restart: always
    depends_on:
      - loki

  # =========================================================================
  # REVERSE PROXY: Caddy (Auto HTTPS, Load Balancing)
  # =========================================================================
  caddy:
    image: caddy:latest
    container_name: hajjmed-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: yourdomain.com
      EMAIL: admin@yourdomain.com
    networks:
      - hajjmed-net
    restart: always
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  hajjmed-net:
    driver: bridge
