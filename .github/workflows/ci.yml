name: hajjmed-platform-ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: production-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
        working-directory: production-platform

      - name: Lint workspace
        run: corepack pnpm lint
        working-directory: production-platform

      - name: Build workspace
        run: corepack pnpm build
        working-directory: production-platform

      - name: Run API validation tests
        run: corepack pnpm --filter @hajjmed/api test
        working-directory: production-platform
